services:
  - type: web
    name: market-point-pro
    runtime: node
    plan: starter
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: market-point-pro-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: DB_PATH
        value: /var/data/db.json
      - key: DATABASE_URL
        sync: false
      - key: LEGACY_ADMIN_KEY_ENABLED
        value: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: USER_SESSION_TTL_HOURS
        value: 24
      - key: WALLET_ENCRYPTION_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: KYC_STORAGE_PROVIDER
        value: ""
      - key: KYC_LOCAL_DIR
        value: /var/data/kyc_docs
      - key: KYC_S3_REGION
        sync: false
      - key: KYC_S3_ENDPOINT
        sync: false
      - key: KYC_S3_BUCKET
        sync: false
      - key: KYC_S3_ACCESS_KEY_ID
        sync: false
      - key: KYC_S3_SECRET_ACCESS_KEY
        sync: false
